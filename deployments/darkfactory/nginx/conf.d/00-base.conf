# Dark Factory tier (vm-mcp). http-context settings shared by both listeners.

# The host's nginx stream relay terminates nothing: it hands each TCP
# connection to this container with a PROXY v2 header, because rootless podman
# port forwarding would otherwise show every client as the same address. The
# published ports bind 127.0.0.1 only, so the header can come from the relay
# alone, and the client address in it is what allow/deny and rate limits see.
set_real_ip_from 0.0.0.0/0;
real_ip_header proxy_protocol;

modsecurity on;
modsecurity_rules_file /etc/modsecurity.d/setup.conf;

log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent" $request_id';
access_log /dev/stdout main;
error_log /dev/stderr warn;

limit_req_zone $binary_remote_addr zone=api:10m rate=600r/m;

map $ssl_client_s_dn $client_cert_cn {
    default              "";
    "~CN=(?<cn>[^,/]+)"  $cn;
}
# The CN reaches the proxy only on the mTLS path; "" everywhere else so a
# client cannot assert an identity by sending the header itself.
map $request_uri $client_cert_cn_safe {
    default            "";
    "~^/api/v1/tools/" $client_cert_cn;
}

# Operator networks: the house, the tailnet (SNAT 10.77.10.20) and vm-dev.
# Factory agents (10.77.50.0/24) use /mcp and the mTLS listener, never the
# admin surfaces of the platform or of Keycloak.
geo $operator_src {
    default        0;
    192.168.0.0/24 1;
    10.77.10.20    1;
    10.77.90.10    1;
}

# Container-local liveness for the healthcheck: the public listeners demand a
# PROXY header the healthcheck cannot send. Not published.
server {
    listen 127.0.0.1:8080;
    access_log off;
    location = /healthz { return 200 "ok\n"; }
    location / { return 404; }
}
