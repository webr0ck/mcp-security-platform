# Dark Factory tier (vm-mcp): one address, https://10.77.30.30.
#   :443  OAuth/OIDC, /mcp, portal, Keycloak. No client-cert request at all:
#         an optional CertificateRequest breaks Schannel-based clients (Codex).
#   :8445 mTLS (step-ca client certificates) for /api/v1/tools/ only.
# Derived from lab/nginx/conf.d/mcp-proxy-lab.conf; the comments there explain
# each CRS exemption.

server {
    listen 443 ssl proxy_protocol;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.3;
    ssl_verify_client off;

    resolver 10.89.240.1 valid=5s ipv6=off;
    set $upstream_proxy http://proxy:8000;
    set $upstream_kc http://keycloak:8080;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Request-Id $request_id always;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id      $request_id;
    proxy_set_header X-Client-Cert-CN  "";
    include /etc/nginx/secrets/gateway-secret.conf;
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
    proxy_send_timeout    30s;
    absolute_redirect off;

    location = /ca.crt {
        modsecurity off;
        alias /etc/nginx/tls/ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="mcp-df-ca.crt"';
    }

    location = /health/ready { access_log off; proxy_pass $upstream_proxy; }
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway","tier":"darkfactory"}';
    }

    location /mcp {
        limit_req zone=api burst=50 nodelay;
        proxy_pass $upstream_proxy;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
    location /.well-known/ { access_log off; proxy_pass $upstream_proxy; }
    location /oauth/       { limit_req zone=api burst=20 nodelay; proxy_pass $upstream_proxy; }
    location /auth/        { limit_req zone=api burst=50 nodelay; proxy_pass $upstream_proxy; }

    # Keycloak admin console first: regex locations match in file order.
    location ~ ^/admin/(mcp|master|realms)/ {
        if ($operator_src = 0) { return 403; }
        modsecurity off;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass $upstream_kc;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    # Operator-only surfaces of the platform.
    location ~ ^/(admin|portal|api/v1/admin/|api/v1/audit/|api/v1/compliance/) {
        if ($operator_src = 0) { return 403; }
        limit_req zone=api burst=50 nodelay;
        proxy_pass $upstream_proxy;
    }
    location /api/ { limit_req zone=api burst=50 nodelay; proxy_pass $upstream_proxy; }

    location ~* "(^|/)\.(env|git|htpasswd|pem|key|crt|p12|pfx)(|\..*)?$" { return 403; }

    # Keycloak: the login flow is public to every client the firewall admits;
    # the admin console is operator-only.
    location /realms/ {
        modsecurity off;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass $upstream_kc;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }
    location /resources/ {
        modsecurity off;
        proxy_pass $upstream_kc;
        proxy_set_header X-Forwarded-Host $http_host;
        expires 1h;
    }
    location = / { return 302 /portal; }
    location / { limit_req zone=api burst=50 nodelay; proxy_pass $upstream_proxy; }

    modsecurity_rules_file /etc/modsecurity.d/custom/mcp-jsonrpc-rules.conf;
    modsecurity_rules 'SecRuleRemoveById 920350';
    modsecurity_rules 'SecRuleRemoveById 911100';
    modsecurity_rules 'SecRule REQUEST_URI "@beginsWith /api/v1/auth/oidc/callback" "id:9001,phase:1,pass,nolog,ctl:ruleRemoveById=931100"';
    modsecurity_rules 'SecRule REQUEST_URI "@beginsWith /oauth/register" "id:9002,phase:1,pass,nolog,ctl:ruleRemoveById=934110,ctl:ruleRemoveById=931100"';
    modsecurity_rules 'SecRule REQUEST_URI "@beginsWith /api/v1/submissions" "id:9003,phase:1,pass,nolog,ctl:ruleRemoveByTag=attack-xss,ctl:ruleRemoveByTag=attack-sqli"';
    modsecurity_rules 'SecRule REQUEST_URI "@beginsWith /api/v1/admin/submissions" "id:9004,phase:1,pass,nolog,ctl:ruleRemoveByTag=attack-xss,ctl:ruleRemoveByTag=attack-sqli"';
    modsecurity_rules 'SecRule REQUEST_URI "@beginsWith /portal/submit" "id:9005,phase:1,pass,nolog,ctl:ruleRemoveById=950150"';
    modsecurity_rules 'SecRule REQUEST_BODY "@rx (plan_mcp_server|submit_mcp_server|get_server_scaffold|check_submission_status)" "id:9006,phase:2,pass,nolog,t:none,ctl:ruleRemoveById=934110,ctl:ruleRemoveById=931100"';
}

server {
    listen 8445 ssl proxy_protocol;
    server_name _;

    ssl_certificate        /etc/nginx/tls/server.crt;
    ssl_certificate_key    /etc/nginx/tls/server.key;
    ssl_protocols          TLSv1.3;
    ssl_client_certificate /etc/nginx/step-ca/certs/root_ca.crt;
    ssl_verify_client      on;

    resolver 10.89.240.1 valid=5s ipv6=off;
    set $upstream_proxy http://proxy:8000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Request-Id $request_id always;
    proxy_hide_header Server;
    proxy_http_version 1.1;

    location /api/v1/tools/ {
        limit_req zone=api burst=5 nodelay;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id      $request_id;
        proxy_set_header X-Client-Cert-CN  $client_cert_cn_safe;
        include /etc/nginx/secrets/gateway-secret.conf;
        proxy_pass $upstream_proxy;
    }
    location / { return 404; }

    modsecurity_rules_file /etc/modsecurity.d/custom/mcp-jsonrpc-rules.conf;
    modsecurity_rules 'SecRuleRemoveById 920350';
}
