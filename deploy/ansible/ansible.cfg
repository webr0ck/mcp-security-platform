[defaults]
inventory       = inventories/dev/hosts.yml
roles_path      = roles
# collections_path intentionally left at Ansible's default search path
# (~/.ansible/collections:/usr/share/ansible/collections) — pointing this at
# a local ./collections dir here shadowed the real installed collections and
# broke module resolution for ansible-lint (containers.podman, ansible.posix
# both installed globally via `ansible-galaxy collection install -r
# requirements.yml`, not vendored into this repo).
retry_files_enabled = False
host_key_checking  = True
interpreter_python = auto_silent
# `stdout_callback = yaml` used to mean community.general's `yaml` callback
# plugin; that plugin was REMOVED in community.general 12.0.0 (superseded by
# ansible.builtin.default's own result_format option) and this environment
# has 12.0.0+ installed, so the old setting broke every real playbook run
# (still passed --syntax-check, which doesn't load callback plugins — only
# caught by actually running one). Left at ansible-core's built-in default
# rather than re-pointing at another plugin that could be removed the same
# way; set `[callback_default] result_format = yaml` locally if you want the
# more readable output back.
callbacks_enabled = timer, profile_tasks
gathering       = smart
fact_caching    = jsonfile
fact_caching_connection = .ansible-fact-cache
fact_caching_timeout = 3600
nocows          = 1

[privilege_escalation]
become          = True
become_method   = sudo
become_ask_pass = False

[ssh_connection]
pipelining      = True
control_path_dir = ~/.ansible/cp
