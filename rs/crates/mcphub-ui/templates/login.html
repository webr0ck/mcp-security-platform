<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · MCP Hub</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main id="main" role="main" style="max-width: 420px; margin: 10vh auto 0;">
    <h1>Sign in to MCP Hub</h1>
    <p class="lede">
      This is a development session picker.
      TEMP: real sign-in is OIDC PKCE against the configured IDP, owned by
      <code>mcphub-identity</code> (component 2) — swap this form for a
      redirect to <code>/auth/login</code> once that lands.
    </p>
    {% if let Some(err) = error %}
    <p class="error-state" role="alert">{{ err }}</p>
    {% endif %}
    <form method="post" action="/login">
      <div class="form-row">
        <label for="session">Development session</label>
        <select id="session" name="session">
          <option value="sess-admin">Super admin (admin-1)</option>
          <option value="sess-owner">Server owner (owner-1)</option>
          <option value="sess-security">Security team (secteam-1)</option>
          <option value="sess-employee">Employee (employee-1)</option>
        </select>
      </div>
      <button type="submit" class="btn btn--primary">Sign in</button>
    </form>
  </main>
</body>
</html>
