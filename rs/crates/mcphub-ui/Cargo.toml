[package]
name = "mcphub-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# On by default so this crate's own `cargo test` keeps exercising the dev
# picker (see tests/template_smoke.rs, tests/role_gating.rs). `mcphubd`
# (the production binary) depends on this crate with
# `default-features = false`, so the picker is compiled out of the actual
# release/lab binary — see router.rs's doc comment for why a reachable
# session picker in production is a total auth bypass.
default = ["dev_login"]
dev_login = []

[dependencies]
mcphub-types = { workspace = true }
axum = { workspace = true, features = ["query"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["trace", "util", "fs"] }
tokio = { workspace = true }
askama = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
time = { workspace = true, features = ["formatting"] }
async-trait = { workspace = true }
base64 = "0.22"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
http-body-util = "0.1"
